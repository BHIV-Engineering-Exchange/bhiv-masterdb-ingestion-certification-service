name: MasterDB CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Deployment action"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback

env:
  IMAGE_NAME: masterdb-ingestion-certification-service
  DEPLOY_DIR: MASTERDB
  CONTAINER_NAME: masterdb-api
  CONTAINER_PORT: "8000"
  START_PORT: "30308"

jobs:

  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q


  # ============================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tags
        id: image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=latest" >> "$GITHUB_OUTPUT"

          echo "Docker image:"
          echo "${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${SHORT_SHA}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}" \
            -t "${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:latest" \
            .

      - name: Push SHA image
        run: |
          docker push \
            "${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}"

      - name: Push latest image
        run: |
          docker push \
            "${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:latest"


  # ============================================================
  # 3. DEPLOY
  # ============================================================
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build

    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Create .env from GitHub Secret
      # --------------------------------------------------------
      - name: Create production .env
        env:
          MASTERDB_ENV_FILE: ${{ secrets.MASTERDB_ENV_FILE }}
        shell: bash
        run: |
          if [ -z "$MASTERDB_ENV_FILE" ]; then
            echo "ERROR: MASTERDB_ENV_FILE secret is empty or missing."
            exit 1
          fi

          printf '%s\n' "$MASTERDB_ENV_FILE" > .env
          chmod 600 .env

          echo ".env created successfully."

      # --------------------------------------------------------
      # Create production docker-compose.yml
      # --------------------------------------------------------
      - name: Create production docker-compose.yml
        shell: bash
        run: |
          cat > docker-compose.yml <<'EOF'
          services:
            api:
              image: ${DOCKER_USERNAME}/masterdb-ingestion-certification-service:${IMAGE_TAG}
              container_name: masterdb-api

              ports:
                - "${MASTERDB_PORT}:8000"

              env_file:
                - .env

              volumes:
                - masterdb_datasets:/app/datasets
                - masterdb_reports:/app/reports

              healthcheck:
                test:
                  - CMD
                  - curl
                  - -f
                  - http://localhost:8000/health
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 10s

              restart: unless-stopped

              networks:
                - masterdb-network

          volumes:
            masterdb_datasets:
              name: masterdb_datasets

            masterdb_reports:
              name: masterdb_reports

          networks:
            masterdb-network:
              driver: bridge
          EOF

          echo "Production docker-compose.yml created."

      # --------------------------------------------------------
      # Validate files
      # --------------------------------------------------------
      - name: Validate deployment files
        shell: bash
        run: |
          test -f docker-compose.yml
          test -f .env

          echo "docker-compose.yml exists."
          echo ".env exists."

      # --------------------------------------------------------
      # Install sshpass
      # --------------------------------------------------------
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # --------------------------------------------------------
      # Prepare MASTERDB directory
      # --------------------------------------------------------
      - name: Prepare VM
        env:
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_IP: ${{ secrets.VM_IP }}
          VM_PORT: ${{ secrets.VM_PORT }}
        shell: bash
        run: |
          sshpass -p "$VM_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -p "$VM_PORT" \
            "$VM_USERNAME@$VM_IP" \
            "mkdir -p $DEPLOY_DIR/history"

      # --------------------------------------------------------
      # Copy ONLY compose and .env
      # --------------------------------------------------------
      - name: Copy deployment files
        env:
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_IP: ${{ secrets.VM_IP }}
          VM_PORT: ${{ secrets.VM_PORT }}
        shell: bash
        run: |
          sshpass -p "$VM_PASSWORD" scp \
            -o StrictHostKeyChecking=no \
            -P "$VM_PORT" \
            docker-compose.yml \
            .env \
            "$VM_USERNAME@$VM_IP:$DEPLOY_DIR/"

      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------
      - name: Deploy application
        env:
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_IP: ${{ secrets.VM_IP }}
          VM_PORT: ${{ secrets.VM_PORT }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |

          SHORT_SHA="${GITHUB_SHA::7}"

          sshpass -p "$VM_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -p "$VM_PORT" \
            "$VM_USERNAME@$VM_IP" \
            "DOCKER_USERNAME='$DOCKER_USERNAME' \
             DOCKER_PASSWORD='$DOCKER_PASSWORD' \
             IMAGE_TAG='$SHORT_SHA' \
             START_PORT='$START_PORT' \
             DEPLOY_DIR='$DEPLOY_DIR' \
             CONTAINER_NAME='$CONTAINER_NAME' \
             bash -s" <<'REMOTE_SCRIPT'

          set -e

          cd "$DEPLOY_DIR"

          echo "========================================"
          echo "MASTERDB DEPLOYMENT"
          echo "========================================"

          echo "Deployment directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          # ------------------------------------------------------
          # DockerHub login
          # ------------------------------------------------------
          echo ""
          echo "Logging into DockerHub..."

          echo "$DOCKER_PASSWORD" | docker login \
            -u "$DOCKER_USERNAME" \
            --password-stdin

          # ------------------------------------------------------
          # Save current deployment for rollback
          # ------------------------------------------------------
          if docker inspect "$CONTAINER_NAME" >/dev/null 2>&1; then

            echo ""
            echo "Existing deployment detected."

            mkdir -p history

            TIMESTAMP="$(date +%Y%m%d_%H%M%S)"

            cp docker-compose.yml \
              "history/compose_${TIMESTAMP}.yml"

            docker inspect "$CONTAINER_NAME" \
              > "history/container_${TIMESTAMP}.json"

            echo "Previous deployment saved."

          else

            echo ""
            echo "No previous deployment found."

          fi

          # ------------------------------------------------------
          # Determine port
          # ------------------------------------------------------

          HOST_PORT="$START_PORT"

          # If an existing container is running, try to reuse
          # its current host port.
          EXISTING_PORT="$(docker inspect \
            -f '{{range $p, $conf := .NetworkSettings.Ports}}{{if $conf}}{{(index $conf 0).HostPort}}{{end}}{{end}}' \
            "$CONTAINER_NAME" 2>/dev/null || true)"

          if [ -n "$EXISTING_PORT" ]; then
            HOST_PORT="$EXISTING_PORT"
            echo "Reusing existing MASTERDB port: $HOST_PORT"
          else

            while ss -ltnH | awk '{print $4}' | grep -qE ":${HOST_PORT}$"; do
              echo "Port $HOST_PORT is already in use."
              HOST_PORT=$((HOST_PORT + 1))
            done

            echo "Selected free port: $HOST_PORT"

          fi

          # ------------------------------------------------------
          # Export compose variables
          # ------------------------------------------------------

          export DOCKER_USERNAME
          export IMAGE_TAG="$IMAGE_TAG"
          export MASTERDB_PORT="$HOST_PORT"

          echo ""
          echo "Image:"
          echo "${DOCKER_USERNAME}/masterdb-ingestion-certification-service:${IMAGE_TAG}"

          echo ""
          echo "Host port:"
          echo "$MASTERDB_PORT"

          # ------------------------------------------------------
          # Pull new image
          # ------------------------------------------------------

          echo ""
          echo "Pulling Docker image..."

          docker pull \
            "${DOCKER_USERNAME}/masterdb-ingestion-certification-service:${IMAGE_TAG}"

          # ------------------------------------------------------
          # Stop current deployment
          # ------------------------------------------------------

          echo ""
          echo "Stopping current deployment..."

          docker compose down || true

          # ------------------------------------------------------
          # Start new deployment
          # ------------------------------------------------------

          echo ""
          echo "Starting new deployment..."

          docker compose up -d

          # ------------------------------------------------------
          # Wait for container
          # ------------------------------------------------------

          echo ""
          echo "Waiting for container..."

          for i in $(seq 1 30); do

            if docker inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
              echo "Container exists."
              break
            fi

            echo "Waiting... $i/30"
            sleep 2

          done

          # ------------------------------------------------------
          # Health check
          # ------------------------------------------------------

          echo ""
          echo "Checking container health..."

          HEALTHY="false"

          for i in $(seq 1 30); do

            STATUS="$(docker inspect \
              -f '{{.State.Health.Status}}' \
              "$CONTAINER_NAME" 2>/dev/null || echo "starting")"

            echo "Health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              HEALTHY="true"
              break
            fi

            sleep 5

          done

          # ------------------------------------------------------
          # Deployment failed
          # ------------------------------------------------------

          if [ "$HEALTHY" != "true" ]; then

            echo ""
            echo "========================================"
            echo "DEPLOYMENT FAILED"
            echo "========================================"

            docker compose ps || true
            docker compose logs --tail=100 || true

            echo ""
            echo "Attempting automatic rollback..."

            docker compose down || true

            # Find latest previous compose file
            PREVIOUS_COMPOSE="$(ls -t history/compose_*.yml 2>/dev/null | head -n 1 || true)"

            if [ -n "$PREVIOUS_COMPOSE" ]; then

              echo "Restoring:"
              echo "$PREVIOUS_COMPOSE"

              cp "$PREVIOUS_COMPOSE" docker-compose.yml

              # Restore image/port variables from saved compose.
              PREVIOUS_IMAGE="$(grep 'image:' docker-compose.yml | head -n 1 | sed 's/.*image: //')"
              PREVIOUS_PORT="$(grep -oE '\$\{MASTERDB_PORT\}:8000|[0-9]+:8000' docker-compose.yml | head -n 1 | cut -d: -f1)"

              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Previous image:"
                echo "$PREVIOUS_IMAGE"

                docker pull "$PREVIOUS_IMAGE" || true
              fi

              if [ -n "$PREVIOUS_PORT" ]; then
                export MASTERDB_PORT="$PREVIOUS_PORT"
              fi

              export DOCKER_USERNAME

              docker compose up -d

              echo "Rollback started."

            else

              echo "No previous deployment available."
              echo "Nothing to rollback to."

            fi

            exit 1

          fi

          # ------------------------------------------------------
          # Deployment successful
          # ------------------------------------------------------

          echo ""
          echo "========================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "========================================"

          docker compose ps

          echo ""
          echo "MASTERDB host port:"
          echo "$MASTERDB_PORT"

          echo ""
          echo "Image:"
          echo "${DOCKER_USERNAME}/masterdb-ingestion-certification-service:${IMAGE_TAG}"

          REMOTE_SCRIPT


  # ============================================================
  # 4. MANUAL ROLLBACK
  # ============================================================
  rollback:
    name: Manual Rollback
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'rollback'

    steps:

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Rollback MASTERDB
        env:
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_IP: ${{ secrets.VM_IP }}
          VM_PORT: ${{ secrets.VM_PORT }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |

          sshpass -p "$VM_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -p "$VM_PORT" \
            "$VM_USERNAME@$VM_IP" \
            "DOCKER_USERNAME='$DOCKER_USERNAME' \
             DOCKER_PASSWORD='$DOCKER_PASSWORD' \
             DEPLOY_DIR='$DEPLOY_DIR' \
             CONTAINER_NAME='$CONTAINER_NAME' \
             bash -s" <<'REMOTE_SCRIPT'

          set -e

          cd "$DEPLOY_DIR"

          echo "========================================"
          echo "MASTERDB MANUAL ROLLBACK"
          echo "========================================"

          # ------------------------------------------------------
          # DockerHub login
          # ------------------------------------------------------

          echo "$DOCKER_PASSWORD" | docker login \
            -u "$DOCKER_USERNAME" \
            --password-stdin

          # ------------------------------------------------------
          # Find previous deployment
          # ------------------------------------------------------

          PREVIOUS_COMPOSE="$(ls -t history/compose_*.yml 2>/dev/null | head -n 1 || true)"

          if [ -z "$PREVIOUS_COMPOSE" ]; then
            echo "ERROR: No previous deployment found."
            exit 1
          fi

          echo "Previous deployment:"
          echo "$PREVIOUS_COMPOSE"

          # ------------------------------------------------------
          # Stop current deployment
          # ------------------------------------------------------

          docker compose down || true

          # ------------------------------------------------------
          # Restore compose
          # ------------------------------------------------------

          cp "$PREVIOUS_COMPOSE" docker-compose.yml

          export DOCKER_USERNAME

          # ------------------------------------------------------
          # Get previous image
          # ------------------------------------------------------

          PREVIOUS_IMAGE="$(grep 'image:' docker-compose.yml | head -n 1 | sed 's/.*image: //')"

          if [ -n "$PREVIOUS_IMAGE" ]; then

            echo "Pulling previous image:"
            echo "$PREVIOUS_IMAGE"

            docker pull "$PREVIOUS_IMAGE"

          fi

          # ------------------------------------------------------
          # Restore previous deployment
          # ------------------------------------------------------

          docker compose up -d

          # ------------------------------------------------------
          # Health check
          # ------------------------------------------------------

          HEALTHY="false"

          for i in $(seq 1 30); do

            STATUS="$(docker inspect \
              -f '{{.State.Health.Status}}' \
              "$CONTAINER_NAME" 2>/dev/null || echo "starting")"

            echo "Health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              HEALTHY="true"
              break
            fi

            sleep 5

          done

          if [ "$HEALTHY" != "true" ]; then

            echo "ERROR: Rollback deployment is unhealthy."

            docker compose ps || true
            docker compose logs --tail=100 || true

            exit 1

          fi

          echo ""
          echo "========================================"
          echo "ROLLBACK SUCCESSFUL"
          echo "========================================"

          docker compose ps

          REMOTE_SCRIPT