name: MASTERDB CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Select action"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback

env:
  IMAGE_NAME: masterdb-ingestion-certification-service
  DEPLOY_DIR: MASTERDB
  CONTAINER_NAME: masterdb-api
  CONTAINER_PORT: 8000
  START_PORT: 30308

jobs:

  # ==========================================================
  # 1. TEST
  # ==========================================================

  test:
    name: Test MASTERDB
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v


  # ==========================================================
  # 2. BUILD + TEST + PUSH DOCKER IMAGE
  # ==========================================================

  build:
    name: Build and Push DockerHub
    needs: test
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image information
        id: image
        shell: bash
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}"
          TAG="${GITHUB_SHA::7}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "DockerHub image:"
          echo "${IMAGE}:${TAG}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}" \
            .

      - name: Test Docker image
        run: |
          docker run -d \
            --name masterdb-test \
            -p 18000:8000 \
            "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}"

          echo "Waiting for MASTERDB..."

          for i in {1..30}; do
            if curl -fsS \
              http://127.0.0.1:18000/health \
              > /dev/null 2>&1; then

              echo "Docker health check PASSED."

              docker rm -f masterdb-test
              exit 0
            fi

            echo "Health attempt ${i}/30"
            sleep 2
          done

          echo "Docker health check FAILED."

          docker logs masterdb-test || true
          docker rm -f masterdb-test || true

          exit 1

      - name: Tag latest
        run: |
          docker tag \
            "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}" \
            "${{ steps.image.outputs.image }}:latest"

      - name: Push versioned image
        run: |
          docker push \
            "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}"

      - name: Push latest image
        run: |
          docker push \
            "${{ steps.image.outputs.image }}:latest"

      - name: Build summary
        run: |
          echo "=========================================="
          echo "DOCKERHUB PUSH SUCCESSFUL"
          echo "=========================================="
          echo "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}"
          echo "${{ steps.image.outputs.image }}:latest"
          echo "=========================================="


  # ==========================================================
  # 3. DEPLOY
  # ==========================================================

  deploy:
    name: Deploy MASTERDB
    needs: build
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan \
            -p "${{ secrets.VM_PORT }}" \
            "${{ secrets.VM_IP }}" \
            >> ~/.ssh/known_hosts

      # ------------------------------------------------------
      # CREATE MASTERDB DIRECTORY
      # ------------------------------------------------------

      - name: Create MASTERDB directory
        env:
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          sshpass -p "$VM_PASSWORD" ssh \
            -o StrictHostKeyChecking=yes \
            -p "${{ secrets.VM_PORT }}" \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}" \
            "mkdir -p MASTERDB/history"

      # ------------------------------------------------------
      # VERIFY .env
      # ------------------------------------------------------

      - name: Verify .env
        run: |
          if [ ! -f .env ]; then
            echo "ERROR: .env file not found."
            exit 1
          fi

      # ------------------------------------------------------
      # CREATE PRODUCTION COMPOSE
      # ------------------------------------------------------

      - name: Create docker-compose.yml
        run: |
          cat > docker-compose.yml <<'EOF'
          version: "3.9"

          services:
            api:
              image: ${DOCKER_USERNAME}/masterdb-ingestion-certification-service:${IMAGE_TAG}

              container_name: masterdb-api

              ports:
                - "${MASTERDB_PORT}:8000"

              env_file:
                - .env

              volumes:
                - masterdb_datasets:/app/datasets
                - masterdb_reports:/app/reports

              healthcheck:
                test:
                  [
                    "CMD",
                    "curl",
                    "-f",
                    "http://localhost:8000/health"
                  ]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 10s

              restart: unless-stopped

              networks:
                - masterdb-network

          volumes:
            masterdb_datasets:
              name: masterdb_datasets

            masterdb_reports:
              name: masterdb_reports

          networks:
            masterdb-network:
              driver: bridge
          EOF

      # ------------------------------------------------------
      # COPY ONLY:
      #
      # docker-compose.yml
      # .env
      #
      # NO SOURCE CODE
      # ------------------------------------------------------

      - name: Copy only deployment files
        env:
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          sshpass -p "$VM_PASSWORD" scp \
            -o StrictHostKeyChecking=yes \
            -P "${{ secrets.VM_PORT }}" \
            docker-compose.yml \
            .env \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}:MASTERDB/"

      # ------------------------------------------------------
      # DEPLOY
      # ------------------------------------------------------

      - name: Deploy MASTERDB from DockerHub
        env:
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |

          IMAGE="${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}"
          TAG="${GITHUB_SHA::7}"

          echo "=========================================="
          echo "MASTERDB DEPLOYMENT"
          echo "=========================================="
          echo "Image: ${IMAGE}:${TAG}"
          echo "Directory: MASTERDB"
          echo "Starting port: ${START_PORT}"
          echo "Container port: ${CONTAINER_PORT}"
          echo "=========================================="

          # --------------------------------------------------
          # DockerHub login on VM
          # --------------------------------------------------

          printf '%s' "$DOCKER_PASSWORD" | \
          sshpass -p "$VM_PASSWORD" ssh \
            -o StrictHostKeyChecking=yes \
            -p "${{ secrets.VM_PORT }}" \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}" \
            "docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin"

          # --------------------------------------------------
          # Remote deployment
          # --------------------------------------------------

          sshpass -p "$VM_PASSWORD" ssh \
            -o StrictHostKeyChecking=yes \
            -p "${{ secrets.VM_PORT }}" \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}" \
            "IMAGE='$IMAGE' TAG='$TAG' START_PORT='$START_PORT' DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}' bash -s" <<'REMOTE_SCRIPT'

          set -e

          DEPLOY_DIR="MASTERDB"
          HISTORY_DIR="MASTERDB/history"

          cd "$DEPLOY_DIR"

          echo "=========================================="
          echo "CHECKING AVAILABLE PORT"
          echo "=========================================="

          HOST_PORT="${START_PORT}"

          while ss -ltnH | awk '{print $4}' | grep -Eq "[:.]${HOST_PORT}$"; do
            echo "Port ${HOST_PORT} is occupied."
            HOST_PORT=$((HOST_PORT + 1))
          done

          echo "Selected port: ${HOST_PORT}"

          # --------------------------------------------------
          # Check .env
          # --------------------------------------------------

          if [ ! -f ".env" ]; then
            echo "ERROR: MASTERDB/.env does not exist."
            exit 1
          fi

          # --------------------------------------------------
          # Save previous compose for rollback
          # --------------------------------------------------

          if [ -f "docker-compose.yml" ]; then

            cp \
              docker-compose.yml \
              "${HISTORY_DIR}/previous-compose.yml"

            docker inspect masterdb-api \
              --format='{{.Config.Image}}' \
              > "${HISTORY_DIR}/previous-image.txt" \
              2>/dev/null || true

            date -u +"%Y-%m-%dT%H:%M:%SZ" \
              > "${HISTORY_DIR}/previous-timestamp.txt"

          fi

          # --------------------------------------------------
          # Set Compose variables
          # --------------------------------------------------

          export DOCKER_USERNAME="$DOCKER_USERNAME"
          export IMAGE_TAG="$TAG"
          export MASTERDB_PORT="$HOST_PORT"

          # --------------------------------------------------
          # Validate Compose
          # --------------------------------------------------

          docker compose config > /dev/null

          echo "Docker Compose configuration valid."

          # --------------------------------------------------
          # Pull DockerHub image
          # --------------------------------------------------

          echo "Pulling DockerHub image..."

          docker pull "${IMAGE}:${TAG}"

          # --------------------------------------------------
          # Stop current deployment
          # --------------------------------------------------

          docker compose down || true

          # --------------------------------------------------
          # Start new deployment
          # --------------------------------------------------

          docker compose up -d --remove-orphans

          # --------------------------------------------------
          # Health check
          # --------------------------------------------------

          echo "Waiting for MASTERDB..."

          HEALTH_OK=0

          for i in {1..30}; do

            if curl -fsS \
              "http://127.0.0.1:${HOST_PORT}/health" \
              > /dev/null 2>&1; then

              HEALTH_OK=1

              echo "MASTERDB health check PASSED."

              break
            fi

            echo "Health attempt ${i}/30"

            sleep 3

          done

          # --------------------------------------------------
          # Automatic rollback
          # --------------------------------------------------

          if [ "$HEALTH_OK" -ne 1 ]; then

            echo "=========================================="
            echo "DEPLOYMENT FAILED"
            echo "STARTING AUTOMATIC ROLLBACK"
            echo "=========================================="

            docker compose logs --tail=100 || true

            if [ -f "${HISTORY_DIR}/previous-compose.yml" ]; then

              cp \
                "${HISTORY_DIR}/previous-compose.yml" \
                docker-compose.yml

              docker compose down || true

              docker compose up -d

              echo "Previous deployment restored."

            else

              echo "No previous deployment available."

            fi

            exit 1

          fi

          # --------------------------------------------------
          # Save successful release
          # --------------------------------------------------

          RELEASE_DIR="${HISTORY_DIR}/${TAG}"

          mkdir -p "$RELEASE_DIR"

          cp \
            docker-compose.yml \
            "${RELEASE_DIR}/docker-compose.yml"

          echo "${IMAGE}:${TAG}" \
            > "${RELEASE_DIR}/image.txt"

          echo "${HOST_PORT}" \
            > "${RELEASE_DIR}/port.txt"

          date -u +"%Y-%m-%dT%H:%M:%SZ" \
            > "${RELEASE_DIR}/timestamp.txt"

          echo "${TAG}" \
            > "${HISTORY_DIR}/current-release.txt"

          echo "${HOST_PORT}" \
            > "${HISTORY_DIR}/current-port.txt"

          echo "=========================================="
          echo "MASTERDB DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Image: ${IMAGE}:${TAG}"
          echo "Directory: MASTERDB"
          echo "Port: ${HOST_PORT}"
          echo "Container port: 8000"
          echo "Container: masterdb-api"
          echo "=========================================="

          REMOTE_SCRIPT


  # ==========================================================
  # 4. MANUAL ROLLBACK
  # ==========================================================

  rollback:
    name: Rollback MASTERDB

    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}

    runs-on: ubuntu-latest

    steps:

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan \
            -p "${{ secrets.VM_PORT }}" \
            "${{ secrets.VM_IP }}" \
            >> ~/.ssh/known_hosts

      - name: Rollback previous release
        env:
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |

          sshpass -p "$VM_PASSWORD" ssh \
            -o StrictHostKeyChecking=yes \
            -p "${{ secrets.VM_PORT }}" \
            "${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}" \
            "bash -s" <<'REMOTE_SCRIPT'

          set -e

          DEPLOY_DIR="MASTERDB"
          HISTORY_DIR="MASTERDB/history"

          cd "$DEPLOY_DIR"

          echo "=========================================="
          echo "MASTERDB ROLLBACK"
          echo "=========================================="

          if [ ! -f "${HISTORY_DIR}/previous-compose.yml" ]; then
            echo "ERROR: No previous release found."
            exit 1
          fi

          # Restore previous compose
          cp \
            "${HISTORY_DIR}/previous-compose.yml" \
            docker-compose.yml

          echo "Previous compose restored."

          # Pull previous image
          if [ -f "${HISTORY_DIR}/previous-image.txt" ]; then

            PREVIOUS_IMAGE=$(cat \
              "${HISTORY_DIR}/previous-image.txt")

            echo "Previous image: ${PREVIOUS_IMAGE}"

            docker pull "${PREVIOUS_IMAGE}" || true

          fi

          # Restart previous version
          docker compose down || true

          docker compose up -d

          # Find active port
          ROLLBACK_PORT=$(docker inspect masterdb-api \
            --format='{{(index (index .NetworkSettings.Ports "8000/tcp") 0).HostPort}}' \
            2>/dev/null || true)

          if [ -z "$ROLLBACK_PORT" ]; then

            ROLLBACK_PORT=$(grep -oE '[0-9]+:8000' \
              docker-compose.yml \
              | head -1 \
              | cut -d: -f1)

          fi

          echo "Rollback port: ${ROLLBACK_PORT}"

          # Health check
          HEALTH_OK=0

          for i in {1..30}; do

            if curl -fsS \
              "http://127.0.0.1:${ROLLBACK_PORT}/health" \
              > /dev/null 2>&1; then

              HEALTH_OK=1

              echo "Rollback health check PASSED."

              break

            fi

            echo "Rollback health attempt ${i}/30"

            sleep 3

          done

          if [ "$HEALTH_OK" -ne 1 ]; then

            echo "ROLLBACK FAILED"

            docker compose logs --tail=100 || true

            exit 1

          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" \
            > "${HISTORY_DIR}/rollback-timestamp.txt"

          echo "rollback-success" \
            > "${HISTORY_DIR}/rollback-status.txt"

          echo "=========================================="
          echo "MASTERDB ROLLBACK SUCCESSFUL"
          echo "=========================================="
          echo "Directory: MASTERDB"
          echo "Port: ${ROLLBACK_PORT}"
          echo "=========================================="

          REMOTE_SCRIPT