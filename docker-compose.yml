version: "3.9"

services:

  api:
    image: ${DOCKER_USERNAME}/masterdb-ingestion-certification-service:${IMAGE_TAG}

    container_name: masterdb-api

    ports:
      - "${MASTERDB_PORT}:8000"

    env_file:
      - .env

    volumes:
      - masterdb_datasets:/app/datasets
      - masterdb_reports:/app/reports

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    networks:
      - masterdb-network


volumes:

  masterdb_datasets:
    name: masterdb_datasets

  masterdb_reports:
    name: masterdb_reports


networks:

  masterdb-network:
    driver: bridge