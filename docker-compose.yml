services:

  postgres:
    image: postgres:16-alpine
    container_name: masterdb-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masterdb}
      POSTGRES_USER: ${POSTGRES_USER:-masterdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - masterdb_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-masterdb} -d ${POSTGRES_DB:-masterdb}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - masterdb-network


  api:
    build:
      context: .
      dockerfile: Dockerfile
    
    image: ${DOCKER_USERNAME:-masterdb}/masterdb-ingestion-certification-service:${IMAGE_TAG:-latest}

    container_name: masterdb-api

    ports:
      - "${MASTERDB_PORT:-8000}:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - masterdb_datasets:/app/datasets
      - masterdb_reports:/app/reports
      - masterdb_registry_store:/app/registry_store
      - masterdb_knowledge_object_store:/app/knowledge_object_store
      - masterdb_retrieval_evidence_store:/app/retrieval_evidence_store
      - masterdb_shared_store:/app/shared_store

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

    networks:
      - masterdb-network


volumes:

  masterdb_postgres_data:
    name: masterdb_postgres_data

  masterdb_datasets:
    name: masterdb_datasets

  masterdb_reports:
    name: masterdb_reports

  masterdb_registry_store:
    name: masterdb_registry_store

  masterdb_knowledge_object_store:
    name: masterdb_knowledge_object_store

  masterdb_retrieval_evidence_store:
    name: masterdb_retrieval_evidence_store

  masterdb_shared_store:
    name: masterdb_shared_store


networks:

  masterdb-network:
    name: masterdb-network
    driver: bridge
