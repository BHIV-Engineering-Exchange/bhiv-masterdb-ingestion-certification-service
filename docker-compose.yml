version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masterdb-api
    ports:
      - "8001:8000"
    environment:
      - MDU_BASE_URL=${MDU_BASE_URL}
      - MDU_API_KEY=${MDU_API_KEY}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - PRAVAH_BHIV_INSIGHT_FLOW_BRIDGE=${PRAVAH_BHIV_INSIGHT_FLOW_BRIDGE}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-120}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ./datasets:/app/datasets
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - masterdb-network

volumes: {}

networks:
  masterdb-network:
    driver: bridge
