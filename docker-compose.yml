services:

  postgres:
    image: postgres:16-alpine
    container_name: masterdb-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - masterdb_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - masterdb-network


  api:
    image: ${DOCKER_USERNAME}/masterdb-ingestion-certification-service:${IMAGE_TAG}

    container_name: masterdb-api

    ports:
      - "${MASTERDB_PORT}:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - masterdb_datasets:/app/datasets
      - masterdb_reports:/app/reports

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

    networks:
      - masterdb-network


volumes:

  masterdb_postgres_data:
    name: masterdb_postgres_data

  masterdb_datasets:
    name: masterdb_datasets

  masterdb_reports:
    name: masterdb_reports


networks:

  masterdb-network:
    name: masterdb-network
    driver: bridge